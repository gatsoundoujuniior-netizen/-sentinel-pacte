<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">

  <!-- Fond blanc propre -->
  <rect width="1100" height="620" fill="#f7f8fc"/>

  <!-- Bande titre -->
  <rect width="1100" height="72" fill="#1e2560"/>
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="white">Pipeline de Traitement des Données — SENTINEL</text>
  <text x="550" y="54" text-anchor="middle" font-size="12" fill="#a0a8e0">Du fichier CSV brut jusqu'au tableau de bord · Projet PACTE 2026</text>

  <!-- ═══════════════════════════════════════════
       ÉTAPES PRINCIPALES (ligne du haut)
       ═══════════════════════════════════════════ -->

  <!-- Numéros d'étape (cercles) -->
  <!-- 1 -->
  <circle cx="110" cy="145" r="22" fill="#1e2560"/>
  <text x="110" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="white">1</text>
  <!-- 2 -->
  <circle cx="310" cy="145" r="22" fill="#6c3fc5"/>
  <text x="310" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="white">2</text>
  <!-- 3 -->
  <circle cx="510" cy="145" r="22" fill="#0097a7"/>
  <text x="510" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="white">3</text>
  <!-- 4 -->
  <circle cx="710" cy="145" r="22" fill="#e65100"/>
  <text x="710" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="white">4</text>
  <!-- 5 -->
  <circle cx="910" cy="145" r="22" fill="#2e7d32"/>
  <text x="910" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="white">5</text>

  <!-- Lignes de connexion entre cercles -->
  <line x1="134" y1="145" x2="286" y2="145" stroke="#cbd0e8" stroke-width="3"/>
  <polygon points="286,140 298,145 286,150" fill="#cbd0e8"/>
  <line x1="334" y1="145" x2="486" y2="145" stroke="#cbd0e8" stroke-width="3"/>
  <polygon points="486,140 498,145 486,150" fill="#cbd0e8"/>
  <line x1="534" y1="145" x2="686" y2="145" stroke="#cbd0e8" stroke-width="3"/>
  <polygon points="686,140 698,145 686,150" fill="#cbd0e8"/>
  <line x1="734" y1="145" x2="886" y2="145" stroke="#cbd0e8" stroke-width="3"/>
  <polygon points="886,140 898,145 886,150" fill="#cbd0e8"/>

  <!-- ═══════════════════════════════════════════
       CARTES ÉTAPES
       ═══════════════════════════════════════════ -->

  <!-- CARTE 1 — SOURCE CSV -->
  <rect x="28" y="175" width="166" height="200" rx="12" fill="white" stroke="#1e2560" stroke-width="2"/>
  <rect x="28" y="175" width="166" height="8" rx="6" fill="#1e2560"/>
  <!-- Icône fichier -->
  <rect x="82" y="200" width="58" height="70" rx="4" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <polygon points="124,200 140,200 140,216 124,216" fill="#3949ab"/>
  <polygon points="124,200 124,216 140,216" fill="#7986cb"/>
  <line x1="90" y1="232" x2="132" y2="232" stroke="#9fa8da" stroke-width="1.5"/>
  <line x1="90" y1="242" x2="132" y2="242" stroke="#9fa8da" stroke-width="1.5"/>
  <line x1="90" y1="252" x2="118" y2="252" stroke="#9fa8da" stroke-width="1.5"/>
  <text x="111" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#1e2560">Fichier CSV</text>
  <text x="111" y="308" text-anchor="middle" font-size="10" fill="#555">405 184 lignes</text>
  <text x="111" y="322" text-anchor="middle" font-size="10" fill="#555">9 colonnes</text>
  <rect x="42" y="334" width="138" height="32" rx="6" fill="#e8eaf6"/>
  <text x="111" y="347" text-anchor="middle" font-size="9" fill="#3949ab">co · lpg · temp</text>
  <text x="111" y="360" text-anchor="middle" font-size="9" fill="#3949ab">smoke · humidity</text>

  <!-- CARTE 2 — NETTOYAGE -->
  <rect x="228" y="175" width="166" height="200" rx="12" fill="white" stroke="#6c3fc5" stroke-width="2"/>
  <rect x="228" y="175" width="166" height="8" rx="6" fill="#6c3fc5"/>
  <!-- Icône filtre/entonnoir -->
  <polygon points="270,205 358,205 333,238 333,260 303,272 303,238" fill="#ede7f6" stroke="#7b1fa2" stroke-width="1.5"/>
  <line x1="280" y1="215" x2="348" y2="215" stroke="#ab47bc" stroke-width="1.5" opacity="0.6"/>
  <line x1="288" y1="225" x2="340" y2="225" stroke="#ab47bc" stroke-width="1.5" opacity="0.6"/>
  <text x="311" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#4a148c">Nettoyage</text>
  <text x="311" y="313" text-anchor="middle" font-size="10" fill="#555">Suppression NaN</text>
  <text x="311" y="327" text-anchor="middle" font-size="10" fill="#555">Sélection features</text>
  <rect x="242" y="337" width="138" height="30" rx="6" fill="#ede7f6"/>
  <text x="311" y="350" text-anchor="middle" font-size="9" fill="#7b1fa2">pandas.dropna()</text>
  <text x="311" y="362" text-anchor="middle" font-size="9" fill="#7b1fa2">DataFrame X</text>

  <!-- CARTE 3 — NORMALISATION -->
  <rect x="428" y="175" width="166" height="200" rx="12" fill="white" stroke="#0097a7" stroke-width="2"/>
  <rect x="428" y="175" width="166" height="8" rx="6" fill="#0097a7"/>
  <!-- Icône balance -->
  <line x1="511" y1="205" x2="511" y2="235" stroke="#00838f" stroke-width="2"/>
  <line x1="478" y1="220" x2="544" y2="220" stroke="#00838f" stroke-width="2"/>
  <rect x="472" y="220" width="24" height="16" rx="3" fill="#e0f7fa" stroke="#0097a7" stroke-width="1.5"/>
  <text x="484" y="232" text-anchor="middle" font-size="8" fill="#0097a7">μ=0</text>
  <rect x="516" y="220" width="24" height="16" rx="3" fill="#e0f7fa" stroke="#0097a7" stroke-width="1.5"/>
  <text x="528" y="232" text-anchor="middle" font-size="8" fill="#0097a7">σ=1</text>
  <!-- Formule -->
  <rect x="450" y="242" width="122" height="22" rx="5" fill="#e0f7fa" stroke="#00838f" stroke-width="1"/>
  <text x="511" y="257" text-anchor="middle" font-size="11" fill="#004d40" font-style="italic">z = (x − μ) / σ</text>
  <text x="511" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#006064">Normalisation</text>
  <text x="511" y="308" text-anchor="middle" font-size="10" fill="#555">StandardScaler</text>
  <text x="511" y="322" text-anchor="middle" font-size="10" fill="#555">Même échelle</text>
  <rect x="442" y="334" width="138" height="32" rx="6" fill="#e0f7fa"/>
  <text x="511" y="347" text-anchor="middle" font-size="9" fill="#006064">scaler.fit_transform(X)</text>
  <text x="511" y="360" text-anchor="middle" font-size="9" fill="#006064">→ X_scaled</text>

  <!-- CARTE 4 — ISOLATION FOREST -->
  <rect x="628" y="160" width="166" height="230" rx="12" fill="white" stroke="#e65100" stroke-width="2.5"/>
  <rect x="628" y="160" width="166" height="8" rx="6" fill="#e65100"/>
  <!-- Badge "Coeur" -->
  <rect x="654" y="172" width="114" height="18" rx="9" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="711" y="184" text-anchor="middle" font-size="8" font-weight="700" fill="#e65100">⭐ CŒUR DU SYSTÈME</text>
  <!-- Icône arbres -->
  <polygon points="660,235 673,210 686,235" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.2"/>
  <rect x="670" y="235" width="5" height="8" fill="#795548"/>
  <polygon points="680,238 695,210 710,238" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.2"/>
  <rect x="691" y="238" width="5" height="8" fill="#795548"/>
  <polygon points="705,234 720,206 735,234" fill="#81c784" stroke="#388e3c" stroke-width="1.2"/>
  <rect x="717" y="234" width="5" height="8" fill="#795548"/>
  <!-- Point rouge anomalie -->
  <circle cx="760" cy="220" r="8" fill="#e53935"/>
  <text x="775" y="215" font-size="8" fill="#c62828">anomalie</text>
  <line x1="760" y1="200" x2="760" y2="212" stroke="#e53935" stroke-width="1.5" stroke-dasharray="3,2"/>

  <text x="711" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#bf360c">Isolation Forest</text>
  <text x="711" y="285" text-anchor="middle" font-size="9" fill="#555">100 arbres de décision</text>
  <text x="711" y="299" text-anchor="middle" font-size="9" fill="#555">contamination = 10%</text>
  <rect x="642" y="308" width="138" height="20" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="711" y="322" text-anchor="middle" font-size="9" fill="#e65100">Score ∈ [ −1.0 ,  +0.5 ]</text>
  <rect x="642" y="332" width="138" height="20" rx="5" fill="#fce4ec" stroke="#e91e63" stroke-width="1"/>
  <text x="711" y="346" text-anchor="middle" font-size="9" fill="#c62828">Négatif fort → anomalie</text>
  <rect x="642" y="356" width="138" height="20" rx="5" fill="#e8f5e9" stroke="#43a047" stroke-width="1"/>
  <text x="711" y="370" text-anchor="middle" font-size="9" fill="#2e7d32">Proche de 0 → normal</text>

  <!-- CARTE 5 — CLASSIFICATION -->
  <rect x="828" y="175" width="242" height="200" rx="12" fill="white" stroke="#2e7d32" stroke-width="2"/>
  <rect x="828" y="175" width="242" height="8" rx="6" fill="#2e7d32"/>

  <!-- Zone CRITIQUE -->
  <rect x="844" y="200" width="210" height="38" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <circle cx="864" cy="219" r="10" fill="#e53935"/>
  <text x="864" y="223" text-anchor="middle" font-size="9" font-weight="700" fill="white">!</text>
  <text x="888" y="214" font-size="10" font-weight="700" fill="#b71c1c">CRITIQUE</text>
  <text x="888" y="228" font-size="9" fill="#c62828">Score &lt; −0.099  (percentile 5)</text>

  <!-- Zone SUSPECT -->
  <rect x="844" y="244" width="210" height="38" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <circle cx="864" cy="263" r="10" fill="#f9a825"/>
  <text x="864" y="267" text-anchor="middle" font-size="9" font-weight="700" fill="white">~</text>
  <text x="888" y="258" font-size="10" font-weight="700" fill="#e65100">SUSPECT</text>
  <text x="888" y="272" font-size="9" fill="#f57f17">−0.099 ≤ Score &lt; −0.027</text>

  <!-- Zone NORMAL -->
  <rect x="844" y="288" width="210" height="38" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <circle cx="864" cy="307" r="10" fill="#43a047"/>
  <text x="864" y="311" text-anchor="middle" font-size="9" font-weight="700" fill="white">✓</text>
  <text x="888" y="302" font-size="10" font-weight="700" fill="#1b5e20">NORMAL</text>
  <text x="888" y="316" font-size="9" fill="#2e7d32">Score ≥ −0.027</text>

  <rect x="844" y="333" width="210" height="30" rx="6" fill="#e8f5e9"/>
  <text x="949" y="346" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="600">Recall SIL 1 ≥ 90% ✓</text>
  <text x="949" y="358" text-anchor="middle" font-size="9" fill="#388e3c">IEC 61511 · Norme industrielle</text>

  <!-- ═══════════════════════════════════════════
       LIGNE DU BAS — STOCKAGE → DASHBOARD
       ═══════════════════════════════════════════ -->

  <!-- Flèche vers le bas depuis étape 5 -->
  <line x1="949" y1="377" x2="949" y2="415" stroke="#2e7d32" stroke-width="2.5"/>
  <polygon points="944,415 949,428 954,415" fill="#2e7d32"/>

  <!-- Ligne horizontale bas -->
  <line x1="120" y1="455" x2="949" y2="455" stroke="#cbd0e8" stroke-width="2"/>

  <!-- Flèche remontant vers Dashboard -->
  <polygon points="115,450 102,455 115,460" fill="#1e2560"/>

  <!-- Flèche vers InfluxDB -->
  <line x1="949" y1="428" x2="949" y2="455" stroke="#cbd0e8" stroke-width="2"/>

  <!-- BLOC INFLUXDB -->
  <rect x="730" y="468" width="210" height="110" rx="12" fill="white" stroke="#0097a7" stroke-width="2"/>
  <rect x="730" y="468" width="210" height="8" rx="6" fill="#0097a7"/>
  <text x="835" y="492" text-anchor="middle" font-size="11" font-weight="700" fill="#006064">☁️  InfluxDB Cloud</text>
  <text x="835" y="506" text-anchor="middle" font-size="9" fill="#666">Bucket : pacte · Rétention 30j</text>
  <!-- 3 measurements -->
  <rect x="742" y="514" width="56" height="52" rx="6" fill="#e0f7fa"/>
  <text x="770" y="530" text-anchor="middle" font-size="8" font-weight="700" fill="#006064">events</text>
  <text x="770" y="544" text-anchor="middle" font-size="8" fill="#00838f">9 953</text>
  <text x="770" y="558" text-anchor="middle" font-size="7" fill="#4dd0e1">sensor</text>

  <rect x="806" y="514" width="56" height="52" rx="6" fill="#ffebee"/>
  <text x="834" y="530" text-anchor="middle" font-size="8" font-weight="700" fill="#b71c1c">alerts</text>
  <text x="834" y="544" text-anchor="middle" font-size="8" fill="#e53935">57 213</text>
  <text x="834" y="558" text-anchor="middle" font-size="7" fill="#ef9a9a">critiques</text>

  <rect x="870" y="514" width="58" height="52" rx="6" fill="#fff8e1"/>
  <text x="899" y="530" text-anchor="middle" font-size="8" font-weight="700" fill="#e65100">simuls.</text>
  <text x="899" y="544" text-anchor="middle" font-size="8" fill="#f57f17">POST</text>
  <text x="899" y="558" text-anchor="middle" font-size="7" fill="#ffcc02">Flask</text>

  <!-- Flèche InfluxDB → Flask -->
  <line x1="728" y1="523" x2="618" y2="523" stroke="#0097a7" stroke-width="2"/>
  <polygon points="618,518 605,523 618,528" fill="#0097a7"/>
  <text x="666" y="515" text-anchor="middle" font-size="8" fill="#006064">Flux query</text>

  <!-- BLOC FLASK -->
  <rect x="400" y="468" width="200" height="110" rx="12" fill="white" stroke="#388e3c" stroke-width="2"/>
  <rect x="400" y="468" width="200" height="8" rx="6" fill="#388e3c"/>
  <text x="500" y="492" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">🐍  Flask API</text>
  <text x="500" y="506" text-anchor="middle" font-size="9" fill="#666">app.py · Port 5000</text>
  <!-- Endpoints -->
  <rect x="412" y="514" width="88" height="20" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="456" y="528" text-anchor="middle" font-size="8" fill="#2e7d32">GET /api/data</text>
  <rect x="506" y="514" width="82" height="20" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="547" y="528" text-anchor="middle" font-size="8" fill="#2e7d32">GET /alerts</text>
  <rect x="412" y="540" width="88" height="20" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="456" y="554" text-anchor="middle" font-size="8" fill="#2e7d32">GET /sensor</text>
  <rect x="506" y="540" width="82" height="20" rx="4" fill="#fff3e0" stroke="#ffcc02" stroke-width="1"/>
  <text x="547" y="554" text-anchor="middle" font-size="8" fill="#e65100">POST /sim</text>
  <!-- JSON badge -->
  <rect x="412" y="566" width="176" height="8" rx="4" fill="#e8f5e9"/>
  <text x="500" y="573" text-anchor="middle" font-size="7.5" fill="#388e3c">→  Réponse JSON à chaque appel</text>

  <!-- Flèche Flask → Dashboard -->
  <line x1="398" y1="523" x2="290" y2="523" stroke="#388e3c" stroke-width="2"/>
  <polygon points="290,518 277,523 290,528" fill="#388e3c"/>
  <text x="340" y="515" text-anchor="middle" font-size="8" fill="#2e7d32">JSON</text>

  <!-- BLOC DASHBOARD -->
  <rect x="50" y="468" width="220" height="110" rx="12" fill="white" stroke="#1e2560" stroke-width="2"/>
  <rect x="50" y="468" width="220" height="8" rx="6" fill="#1e2560"/>
  <text x="160" y="492" text-anchor="middle" font-size="11" font-weight="700" fill="#1e2560">🖥️  Interface SENTINEL</text>
  <text x="160" y="506" text-anchor="middle" font-size="9" fill="#666">HTML · CSS · JavaScript · Chart.js</text>

  <!-- Mini KPIs -->
  <rect x="62" y="514" width="48" height="28" rx="5" fill="#e8eaf6" stroke="#3949ab" stroke-width="1"/>
  <text x="86" y="526" text-anchor="middle" font-size="7" fill="#3949ab">Total</text>
  <text x="86" y="537" text-anchor="middle" font-size="10" font-weight="700" fill="#1e2560">9 953</text>

  <rect x="116" y="514" width="48" height="28" rx="5" fill="#ffebee" stroke="#e53935" stroke-width="1"/>
  <text x="140" y="526" text-anchor="middle" font-size="7" fill="#b71c1c">Critiques</text>
  <text x="140" y="537" text-anchor="middle" font-size="10" font-weight="700" fill="#e53935">2 846</text>

  <rect x="170" y="514" width="48" height="28" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="194" y="526" text-anchor="middle" font-size="7" fill="#e65100">Suspects</text>
  <text x="194" y="537" text-anchor="middle" font-size="10" font-weight="700" fill="#f57f17">694</text>

  <rect x="224" y="514" width="34" height="28" rx="5" fill="#e8f5e9" stroke="#43a047" stroke-width="1"/>
  <text x="241" y="526" text-anchor="middle" font-size="7" fill="#2e7d32">OK</text>
  <text x="241" y="537" text-anchor="middle" font-size="9" font-weight="700" fill="#2e7d32">6 413</text>

  <!-- Auto-refresh note -->
  <rect x="62" y="548" width="196" height="20" rx="5" fill="#e8eaf6"/>
  <text x="160" y="561" text-anchor="middle" font-size="8.5" fill="#3949ab">🔄  Rafraîchissement auto toutes les 30s</text>

  <!-- Flèche retour fetch (Dashboard → Flask) -->
  <path d="M 160 466 L 160 440 L 500 440 L 500 466" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="495,466 500,478 505,466" fill="#bbb"/>
  <text x="330" y="434" text-anchor="middle" font-size="8" fill="#999">fetch('/api/...') toutes les 30s</text>

  <!-- ═══════════════════════════════════════════
       LÉGENDE
       ═══════════════════════════════════════════ -->
  <rect x="50" y="596" width="1000" height="18" rx="6" fill="#e8eaf6"/>
  <text x="550" y="609" text-anchor="middle" font-size="9" fill="#3949ab">
    Étapes 1→5 : traitement dans pacte.ipynb (Jupyter) · Raspberry Pi replay le 6 avril 2026 · Flask sert les données · Interface affiche les résultats
  </text>

</svg>
