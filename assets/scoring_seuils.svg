<svg viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif">

  <rect width="960" height="820" fill="#f7f8fc"/>

  <!-- TITRE -->
  <rect width="960" height="64" fill="#1e2560"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="white">Système de Scoring et Seuils de Risque — P5 / P10</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#9da8e0">Isolation Forest · Projet PACTE · Comment le système décide qu'il y a danger</text>

  <!-- ══════════════════════════════════
       BLOC 1 : C'EST QUOI LE SCORE ?
       ══════════════════════════════════ -->
  <rect x="16" y="80" width="928" height="120" rx="10" fill="white" stroke="#3949ab" stroke-width="1.5"/>
  <rect x="16" y="80" width="928" height="32" rx="10" fill="#3949ab"/>
  <text x="36" y="101" font-size="12" font-weight="700" fill="white">1. Qu'est-ce que le score d'anomalie ?</text>

  <!-- Explication simple -->
  <rect x="32" y="122" width="420" height="66" rx="8" fill="#e8eaf6"/>
  <text x="242" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#1a237e">En langage simple</text>
  <text x="242" y="160" text-anchor="middle" font-size="9.5" fill="#3949ab">L'Isolation Forest construit 100 arbres de décision aléatoires.</text>
  <text x="242" y="175" text-anchor="middle" font-size="9.5" fill="#3949ab">Une mesure ANORMALE est facile à isoler → score très négatif.</text>
  <text x="242" y="190" text-anchor="middle" font-size="9.5" fill="#3949ab">Une mesure NORMALE est difficile à isoler → score proche de 0.</text>

  <!-- Formule -->
  <rect x="468" y="122" width="460" height="66" rx="8" fill="#e3f2fd"/>
  <text x="698" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">Ce que produit l'algorithme</text>
  <text x="698" y="160" text-anchor="middle" font-size="9.5" fill="#1565c0">score = model.score_samples(X_scaled)</text>
  <text x="698" y="175" text-anchor="middle" font-size="9.5" fill="#1565c0">Plage des valeurs :  −1.0  à  +0.5</text>
  <text x="698" y="190" text-anchor="middle" font-size="9.5" fill="#1565c0">Plus le score est négatif → plus c'est suspect</text>

  <!-- ══════════════════════════════════
       BLOC 2 : ÉCHELLE VISUELLE
       ══════════════════════════════════ -->
  <rect x="16" y="216" width="928" height="170" rx="10" fill="white" stroke="#546e7a" stroke-width="1.5"/>
  <rect x="16" y="216" width="928" height="32" rx="10" fill="#546e7a"/>
  <text x="36" y="237" font-size="12" font-weight="700" fill="white">2. L'échelle des scores — de −1.0 à +0.5</text>

  <!-- Barre de score horizontale -->
  <!-- Zone CRITIQUE (rouge) -->
  <rect x="60" y="264" width="200" height="48" rx="0" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <!-- Zone SUSPECT (orange) -->
  <rect x="260" y="264" width="180" height="48" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <!-- Zone NORMAL (vert) -->
  <rect x="440" y="264" width="460" height="48" rx="0" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <!-- Arrondi droite -->
  <rect x="880" y="264" width="20" height="48" rx="4" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>

  <!-- Labels dans la barre -->
  <text x="160" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#b71c1c">CRITIQUE</text>
  <text x="160" y="300" text-anchor="middle" font-size="9" fill="#c62828">−1.0 → −0.099</text>
  <text x="350" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#e65100">SUSPECT</text>
  <text x="350" y="300" text-anchor="middle" font-size="9" fill="#f57f17">−0.099 → −0.027</text>
  <text x="660" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">NORMAL</text>
  <text x="660" y="300" text-anchor="middle" font-size="9" fill="#388e3c">−0.027 → +0.5</text>

  <!-- Graduation sous la barre -->
  <!-- Trait -1.0 -->
  <line x1="60" y1="314" x2="60" y2="330" stroke="#555" stroke-width="1.5"/>
  <text x="60" y="344" text-anchor="middle" font-size="9" fill="#555">−1.0</text>

  <!-- Seuil P5 = -0.099 -->
  <line x1="260" y1="258" x2="260" y2="355" stroke="#e53935" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="216" y="348" width="88" height="20" rx="5" fill="#e53935"/>
  <text x="260" y="362" text-anchor="middle" font-size="9" font-weight="700" fill="white">P5 = −0.099</text>
  <text x="260" y="375" text-anchor="middle" font-size="8" fill="#e53935">Seuil CRITIQUE</text>

  <!-- Seuil P10 = -0.027 -->
  <line x1="440" y1="258" x2="440" y2="355" stroke="#f9a825" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="396" y="348" width="88" height="20" rx="5" fill="#f9a825"/>
  <text x="440" y="362" text-anchor="middle" font-size="9" font-weight="700" fill="white">P10 = −0.027</text>
  <text x="440" y="375" text-anchor="middle" font-size="8" fill="#e65100">Seuil SUSPECT</text>

  <!-- Trait +0.5 -->
  <line x1="900" y1="314" x2="900" y2="330" stroke="#555" stroke-width="1.5"/>
  <text x="900" y="344" text-anchor="middle" font-size="9" fill="#555">+0.5</text>

  <!-- ══════════════════════════════════
       BLOC 3 : D'OÙ VIENNENT P5 / P10 ?
       ══════════════════════════════════ -->
  <rect x="16" y="402" width="928" height="168" rx="10" fill="white" stroke="#7b1fa2" stroke-width="1.5"/>
  <rect x="16" y="402" width="928" height="32" rx="10" fill="#7b1fa2"/>
  <text x="36" y="423" font-size="12" font-weight="700" fill="white">3. D'où viennent les seuils P5 et P10 ?</text>

  <!-- Explication P5 -->
  <rect x="32" y="444" width="272" height="114" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="1.5"/>
  <rect x="32" y="444" width="272" height="26" rx="8" fill="#c2185b"/>
  <text x="168" y="461" text-anchor="middle" font-size="10" font-weight="700" fill="white">Percentile 5 (P5) = −0.099</text>
  <text x="168" y="484" text-anchor="middle" font-size="9" fill="#880e4f" font-weight="600">5% des mesures ont un score</text>
  <text x="168" y="498" text-anchor="middle" font-size="9" fill="#880e4f">inférieur à −0.099</text>
  <text x="168" y="516" text-anchor="middle" font-size="9" fill="#555">→ Utilisé pour détecter les</text>
  <text x="168" y="530" text-anchor="middle" font-size="9" fill="#555">anomalies les plus graves</text>
  <rect x="42" y="540" width="252" height="14" rx="4" fill="white"/>
  <text x="168" y="551" text-anchor="middle" font-size="8" fill="#c2185b">numpy.percentile(scores, 5)</text>

  <!-- Explication P10 -->
  <rect x="328" y="444" width="272" height="114" rx="8" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <rect x="328" y="444" width="272" height="26" rx="8" fill="#e65100"/>
  <text x="464" y="461" text-anchor="middle" font-size="10" font-weight="700" fill="white">Percentile 10 (P10) = −0.027</text>
  <text x="464" y="484" text-anchor="middle" font-size="9" fill="#bf360c" font-weight="600">10% des mesures ont un score</text>
  <text x="464" y="498" text-anchor="middle" font-size="9" fill="#bf360c">inférieur à −0.027</text>
  <text x="464" y="516" text-anchor="middle" font-size="9" fill="#555">→ Utilisé pour détecter les</text>
  <text x="464" y="530" text-anchor="middle" font-size="9" fill="#555">comportements inhabituels</text>
  <rect x="338" y="540" width="252" height="14" rx="4" fill="white"/>
  <text x="464" y="551" text-anchor="middle" font-size="8" fill="#e65100">numpy.percentile(scores, 10)</text>

  <!-- Pourquoi ces seuils ? -->
  <rect x="624" y="444" width="308" height="114" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <rect x="624" y="444" width="308" height="26" rx="8" fill="#3949ab"/>
  <text x="778" y="461" text-anchor="middle" font-size="10" font-weight="700" fill="white">Pourquoi P5 et P10 ?</text>
  <text x="778" y="484" text-anchor="middle" font-size="9" fill="#1a237e">Ces seuils sont calculés sur le dataset</text>
  <text x="778" y="498" text-anchor="middle" font-size="9" fill="#1a237e">complet (405 184 lignes) pour garantir</text>
  <text x="778" y="512" text-anchor="middle" font-size="9" fill="#1a237e">un recall ≥ 90% conforme à la norme</text>
  <text x="778" y="528" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1565c0">IEC 61511 — Niveau SIL 1</text>
  <rect x="634" y="540" width="288" height="14" rx="4" fill="white"/>
  <text x="778" y="551" text-anchor="middle" font-size="8" fill="#3949ab">Validé dans pacte.ipynb — Section scoring</text>

  <!-- ══════════════════════════════════
       BLOC 4 : EXEMPLES DE SCORES
       ══════════════════════════════════ -->
  <rect x="16" y="586" width="928" height="100" rx="10" fill="white" stroke="#546e7a" stroke-width="1.5"/>
  <rect x="16" y="586" width="928" height="32" rx="10" fill="#546e7a"/>
  <text x="36" y="607" font-size="12" font-weight="700" fill="white">4. Exemples de scores réels</text>

  <!-- Exemple CRITIQUE -->
  <rect x="32" y="628" width="190" height="46" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <circle cx="56" cy="651" r="12" fill="#e53935"/>
  <text x="56" y="655" text-anchor="middle" font-size="9" font-weight="700" fill="white">!</text>
  <text x="130" y="644" text-anchor="middle" font-size="9" font-weight="700" fill="#b71c1c">Score : −0.182</text>
  <text x="130" y="660" text-anchor="middle" font-size="8.5" fill="#c62828">Fuite LPG détectée</text>
  <text x="130" y="671" text-anchor="middle" font-size="7.5" fill="#e57373">→ CRITIQUE (−0.182 &lt; −0.099)</text>

  <!-- Exemple CRITIQUE 2 -->
  <rect x="238" y="628" width="190" height="46" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <circle cx="262" cy="651" r="12" fill="#e53935"/>
  <text x="262" y="655" text-anchor="middle" font-size="9" font-weight="700" fill="white">!</text>
  <text x="336" y="644" text-anchor="middle" font-size="9" font-weight="700" fill="#b71c1c">Score : −0.241</text>
  <text x="336" y="660" text-anchor="middle" font-size="8.5" fill="#c62828">Incendie entrepôt</text>
  <text x="336" y="671" text-anchor="middle" font-size="7.5" fill="#e57373">→ CRITIQUE (−0.241 &lt; −0.099)</text>

  <!-- Exemple SUSPECT -->
  <rect x="444" y="628" width="190" height="46" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <circle cx="468" cy="651" r="12" fill="#f9a825"/>
  <text x="468" y="655" text-anchor="middle" font-size="9" font-weight="700" fill="white">~</text>
  <text x="542" y="644" text-anchor="middle" font-size="9" font-weight="700" fill="#e65100">Score : −0.058</text>
  <text x="542" y="660" text-anchor="middle" font-size="8.5" fill="#f57f17">Surchauffe progressive</text>
  <text x="542" y="671" text-anchor="middle" font-size="7.5" fill="#ffb74d">→ SUSPECT (entre −0.099 et −0.027)</text>

  <!-- Exemple NORMAL -->
  <rect x="650" y="628" width="190" height="46" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <circle cx="674" cy="651" r="12" fill="#43a047"/>
  <text x="674" y="655" text-anchor="middle" font-size="9" font-weight="700" fill="white">✓</text>
  <text x="748" y="644" text-anchor="middle" font-size="9" font-weight="700" fill="#2e7d32">Score : +0.190</text>
  <text x="748" y="660" text-anchor="middle" font-size="8.5" fill="#388e3c">Mesure normale</text>
  <text x="748" y="671" text-anchor="middle" font-size="7.5" fill="#81c784">→ NORMAL (+0.190 &gt; −0.027)</text>

  <!-- Exemple NORMAL 2 -->
  <rect x="856" y="628" width="84" height="46" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <circle cx="878" cy="651" r="12" fill="#43a047"/>
  <text x="878" y="655" text-anchor="middle" font-size="9" font-weight="700" fill="white">✓</text>
  <text x="905" y="651" text-anchor="middle" font-size="8.5" fill="#2e7d32">+0.04</text>
  <text x="905" y="665" text-anchor="middle" font-size="7.5" fill="#81c784">NORMAL</text>

  <!-- ══════════════════════════════════
       BLOC 5 : RECALL PAR SCÉNARIO
       ══════════════════════════════════ -->
  <rect x="16" y="700" width="928" height="106" rx="10" fill="white" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="16" y="700" width="928" height="32" rx="10" fill="#2e7d32"/>
  <text x="36" y="721" font-size="12" font-weight="700" fill="white">5. Recall par scénario — Conformité norme SIL 1 (IEC 61511)</text>
  <text x="700" y="721" font-size="10" fill="#c8e6c9">Recall = vrais positifs détectés / total vrais positifs</text>

  <!-- Barres de recall -->
  <!-- Fuite LPG -->
  <text x="36" y="750" font-size="9" fill="#333">Fuite LPG</text>
  <rect x="150" y="738" width="360" height="14" rx="4" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="0.5"/>
  <rect x="150" y="738" width="360" height="14" rx="4" fill="#2e7d32"/>
  <text x="518" y="749" font-size="9" font-weight="700" fill="#1b5e20">100%</text>

  <!-- Intrusion -->
  <text x="36" y="768" font-size="9" fill="#333">Intrusion nocturne</text>
  <rect x="150" y="756" width="360" height="14" rx="4" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="0.5"/>
  <rect x="150" y="756" width="360" height="14" rx="4" fill="#2e7d32"/>
  <text x="518" y="767" font-size="9" font-weight="700" fill="#1b5e20">100%</text>

  <!-- Incendie -->
  <text x="570" y="750" font-size="9" fill="#333">Incendie entrepôt</text>
  <rect x="700" y="738" width="214" height="14" rx="4" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="0.5"/>
  <rect x="700" y="738" width="208" height="14" rx="4" fill="#388e3c"/>
  <text x="920" y="749" font-size="9" font-weight="700" fill="#1b5e20">97.2%</text>

  <!-- Fuite chimique -->
  <text x="570" y="768" font-size="9" fill="#333">Fuite chimique lente</text>
  <rect x="700" y="756" width="214" height="14" rx="4" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="0.5"/>
  <rect x="700" y="756" width="205" height="14" rx="4" fill="#43a047"/>
  <text x="920" y="767" font-size="9" font-weight="700" fill="#1b5e20">95.8%</text>

  <!-- Panne capteur -->
  <text x="36" y="798" font-size="9" fill="#333">Panne capteur</text>
  <rect x="150" y="784" width="300" height="14" rx="4" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="0.5"/>
  <rect x="150" y="784" width="273" height="14" rx="4" fill="#66bb6a"/>
  <text x="458" y="795" font-size="9" font-weight="700" fill="#2e7d32">91.0%</text>

  <!-- Ligne SIL 1 -->
  <line x1="150" y1="730" x2="150" y2="806" stroke="#f9a825" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="150" y1="806" x2="700" y2="806" stroke="#f9a825" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Seuil 90% -->
  <line x1="474" y1="730" x2="474" y2="806" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="914" y1="730" x2="914" y2="800" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="456" y="808" width="36" height="12" rx="3" fill="#fff8e1"/>
  <text x="474" y="818" text-anchor="middle" font-size="7.5" fill="#e65100">90% SIL1</text>
  <rect x="896" y="808" width="36" height="12" rx="3" fill="#fff8e1"/>
  <text x="914" y="818" text-anchor="middle" font-size="7.5" fill="#e65100">90% SIL1</text>
</svg>
